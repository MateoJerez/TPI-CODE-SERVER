<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Iniciar Sesión - Boletín Digital</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="header-wrap">
    <div class="header-brand">
      <img src="/logo.png" alt="Logo Colegio" />
      <h1>Iniciar Sesión</h1>
    </div>
    <img class="header-logo" src="Outer.png" alt="Outer Technologies" />
  </header>

  <nav>
    <div class="nav-inner">
      <a href="/index.html">Inicio</a>
      <a href="/login.html">Iniciar Sesión</a>
      <a href="/registro.html">Registrarse</a>
    </div>
  </nav>

  <main>
    <form id="loginForm" style="max-width:480px;margin:24px auto;padding:20px;border-radius:8px;background:#f5f5f5;">
      <h2 style="margin-top:0">Acceso al Boletín Digital</h2>

      <label for="email">Correo</label>
      <input type="email" id="email" name="email" placeholder="usuario@colegio.test" required />

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="Contraseña" required />

      <label for="login_role">Iniciar sesión como</label>
      <select id="login_role" name="login_role" required>
        <option value="1">Estudiante</option>
        <option value="2">Docente</option>
        <option value="3">Administrador</option>
      </select>

      <button class="btn" type="submit" style="margin-top:12px;">Ingresar</button>
      <p style="margin-top:12px;">¿No tenés cuenta? <a href="/registro.html">Registrate aquí</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <div>
        <strong>Outer Technologies</strong>
        <div>Outertech@Gmail.com</div>
        <div>+54 9 2964 69 30-33</div>
      </div>
    </div>
    <div class="footer-right">
      <div>
        <strong>Colegio Dr.Ernesto Guevara</strong>
        <div>Río Candelaria 3462</div>
        <div>02964 30-0532</div>
      </div>
    </div>
  </footer>

  <script src="/script.js" nonce="{{CSP_NONCE}}"></script>
</body>
</html>
