<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro - Boletín Digital</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="header-wrap">
    <div class="header-brand">
      <img src="/logo.png" alt="Logo Colegio" />
      <h1>Registro</h1>
    </div>
    <img class="header-logo" src="Outer.png" alt="Outer Technologies" />
  </header>

  <nav>
    <div class="nav-inner">
      <a href="/index.html">Inicio</a>
      <a href="/login.html">Iniciar Sesión</a>
      <a href="/registro.html">Registrarse</a>
      <a href="/alumnado.html">Departamento de Alumnado</a>
    </div>
  </nav>

  <main>
    <form id="registerForm" style="max-width:480px;margin:24px auto;padding:20px;border-radius:8px;background:#f5f5f5;">
      <h2 style="margin-top:0">Crear cuenta nueva</h2>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Nombre" required />

      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" name="apellido" placeholder="Apellido" required />

      <label for="email">Correo institucional</label>
      <input type="email" id="email" name="email" placeholder="usuario@colegio.test" required />

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="Contraseña" required />

      <label for="dni">DNI</label>
      <input type="text" id="dni" name="dni" placeholder="Documento Nacional de Identidad" required />

      <label for="id_rol">Registrarme como</label>
      <select id="id_rol" name="id_rol" required>
        <option value="1">Estudiante</option>
        <option value="2">Docente</option>
        <option value="3">Administrador</option>
      </select>

      
      <div id="inviteSection" style="display:none;margin-top:10px;">
        <label for="invite_code">Código de invitación (requerido para docentes)</label>
        <input type="text" id="invite_code" name="invite_code" placeholder="Código de invitación" />
      </div>

      <button class="btn" type="submit" style="margin-top:12px;">Registrar</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <div>
        <strong>Outer Technologies</strong>
        <div>Outertech@Gmail.com</div>
        <div>+54 9 2964 69 30-33</div>
      </div>
    </div>
    <div class="footer-right">
      <div>
        <strong>Colegio Dr.Ernesto Guevara</strong>
        <div>Río Candelaria 3462</div>
        <div>02964 30-0532</div>
      </div>
    </div>
  </footer>

  <script src="/script.js" nonce="{{CSP_NONCE}}"></script>
</body>
</html>
