<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Departamento de Alumnado - Colegio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <header class="header-wrap header-brand">
    <div class="header-brand">
      <img src="logo.png" alt="Logo Colegio">
      <h1>Colegio Provincial Dr. Ernesto Guevara</h1>
    </div>
    <img class="header-logo" src="Outer.png" alt="Outer Technologies" />
  </header>

  <nav class="nav-inner">
    <a href="index.html">Inicio</a>
    <a href="boletin.html">Boletín</a>
    <a href="login.html" id="link-login">Iniciar Sesión</a>
  </nav>

  <main>
    <h2>Departamento de Alumnado</h2>

    <section class="card">
      <h3>1) Cargar nota</h3>
      <form id="cargarNotasForm">
        <label>ID Alumno (ver listado abajo)</label>
        <input id="alumnoId" type="number" placeholder="ID del alumno" required>

        <label>ID Materia</label>
        <select id="materiaId" required>
          <option value="">Seleccionar materia</option>
        </select>

        <label>Cuatrimestre</label>
        <select id="cuatrimestre" required>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>

        <label>Parcial</label>
        <select id="parcial" required>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>

        <label>Nota</label>
        <input id="nota" type="number" step="0.1" min="0" max="10" placeholder="ej. 8.5">

        <button class="btn" type="submit">Cargar nota</button>
      </form>
    </section>

    <section class="card" style="margin-top:18px;">
      <h3>2) Listado de alumnos</h3>
      <button class="btn" id="btnListarAlumnos">Listar alumnos</button>
      <div id="alumnosList" class="table-wrapper"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <div>
        <strong>Outer Technologies</strong>
        <div>Outertech@Gmail.com</div>
        <div>+54 9 2964 69 30-33</div>
      </div>
    </div>
    <div class="footer-right">
      <div>
        <strong>Colegio Dr.Ernesto Guevara</strong>
        <div>Río Candelaria 3462</div>
        <div>02964 30-0532</div>
      </div>
    </div>
  </footer>

  <script src="/script.js" nonce="{{CSP_NONCE}}"></script>

  <script>
    
    async function cargarMaterias() {
      try {
        const res = await fetch('/api/boletin', { credentials: 'include' });
        
        
        const materias = [
          { id_materia:1, materia:'Matemática' },
          { id_materia:2, materia:'Inglés Técnico' },
          { id_materia:3, materia:'Marco Jurídico' },
          { id_materia:4, materia:'Asistencia' },
          { id_materia:5, materia:'Autogestión' },
          { id_materia:6, materia:'Hardware 4' },
          { id_materia:7, materia:'Prácticas Profesionalizantes' },
          { id_materia:8, materia:'Programación' },
          { id_materia:9, materia:'Redes' }
        ];
        const sel = document.getElementById('materiaId');
        materias.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id_materia;
          opt.textContent = m.materia;
          sel.appendChild(opt);
        });
      } catch(e){
        console.error(e);
      }
    }
    document.addEventListener('DOMContentLoaded', cargarMaterias);
  </script>
</body>
</html>
